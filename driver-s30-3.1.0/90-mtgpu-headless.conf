# Fedora default for the Moore Threads mtgpu driver: headless compute mode.
#
# The S30 is used as a compute device while the desktop stays on the GPU the
# monitor is attached to (i915/amdgpu). In this mode mtgpu registers a DRM
# device for compute but no KMS connectors and no fbdev, so it cannot fight
# the display driver for the console or the GNOME/Mutter KMS setup.
#
# To let mtgpu drive the S30's own DP/HDMI outputs instead, replace
# "display=none" with "display=mt" in this file (or pass
# display=mt to modprobe) and reload after a reboot.
options mtgpu display=none disable_fbdev=1 rm_feature_level=1
